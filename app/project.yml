# XcodeGen spec:  brew install xcodegen && xcodegen generate && open PocketGlimmer.xcodeproj
name: PocketGlimmer
options:
  bundleIdPrefix: com.habib.pocketglimmer
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
packages:
  PocketCore: { path: ../core }
targets:
  PocketGlimmer:
    type: application
    platform: iOS
    sources:
      - path: PocketGlimmer      # Resources/Models/*.gguf + calibration.json are copied as bundle resources
    dependencies:
      - package: PocketCore
        product: PocketCore
      # Built from llama.cpp with ./build-xcframework.sh (see app/README.md); placed at app/Frameworks/llama.xcframework
      - framework: Frameworks/llama.xcframework
        embed: true
      - sdk: MessageUI.framework     # Messages / Mail compose sheets for confirmed send_message / send_email
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habib.pocketglimmer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"         # Xcode accepts 4.0/4.2/5.0/6.0 only; "5.10" is rejected
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""          # set your team in Xcode > Signing
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["-lc++"]
    entitlements:
      path: PocketGlimmer/Support/PocketGlimmer.entitlements
      # Free Apple ID (personal team) cannot provision com.apple.developer.kernel.increased-memory-limit,
      # so it is off by default; the 1B Q4_K_M fits without it. With a paid team, uncomment:
      # properties:
      #   com.apple.developer.kernel.increased-memory-limit: true
      properties: {}
    info:
      path: PocketGlimmer/Support/Info.plist
      properties:
        CFBundleDisplayName: Pocket Glimmer
        UILaunchScreen: {}
        # Lets Finder > iPhone > Files copy a .gguf into the app's Documents (AppModel.findModel looks there first)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSRemindersFullAccessUsageDescription: Pocket Glimmer creates and reads reminders you ask for, on this iPhone.
        NSCalendarsFullAccessUsageDescription: Pocket Glimmer creates and looks up events you ask for, on this iPhone.
        NSMicrophoneUsageDescription: Hold the mic to talk. Audio is sent to Muse Voice Transcribe only while you hold it, then deleted.
        NSCameraUsageDescription: Take a photo for a "glimpse". The sensitivity check runs on device before anything is sent to Muse Spark or SAM 3.1.
        NSPhotoLibraryUsageDescription: Pick a photo for a "glimpse". EXIF and location data are stripped before anything leaves the phone.
        NSContactsUsageDescription: Pocket Glimmer finds the right person when you say a name. Contacts never leave the phone.
